name: MHDTV Multi-Server Live Scraper Pipeline

on:
  schedule:
    # প্রতি ৫ মিনিট পর পর অটোমেটিক আপডেট হবে
    - cron: '*/5 * * * *'
  workflow_dispatch: # ম্যানুয়ালি রান করার জন্য

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libfreetype6-dev libjpeg-dev zlib1g-dev

    - name: Install Python Packages
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Main Scraper Engine
      run: |
        python main.py

    - name: Commit and Push Updated Data
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        git add output/
        
        git diff --staged --quiet || (git commit -m "Auto-update: Multi-server streams updated & ended matches purged [skip ci]" && git push)
