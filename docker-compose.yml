# যেকোনো VPS-এ:  docker compose up -d --build
services:
  shobdo-ai:
    build: .
    container_name: shobdo-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data      # মডেল ও করপাস টিকে থাকবে
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 90s
