# Fly.io — একবার: fly launch --no-deploy  (তারপর: fly volumes create shobdo_data --size 1)
app = "shobdo-ai"
primary_region = "sin"   # সিঙ্গাপুর — বাংলাদেশের সবচেয়ে কাছের রিজিয়ন

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"     # কেউ না থাকলে ঘুমাবে, ভিজিটে জাগবে
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 60

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"     # মডেল ~৩০০ MB নেয়; ৫১২ MB-তে training-এ সমস্যা হতে পারে

# মডেল/করপাস সংরক্ষণের জন্য ভলিউম (আগে একবার তৈরি করতে হবে)
[mounts]
  source = "shobdo_data"
  destination = "/app/data"
